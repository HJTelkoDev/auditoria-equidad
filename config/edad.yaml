# ESPECIFICACIÓN DECLARATIVA DE AUDITORÍA DE EQUIDAD CONTRAFACTUAL: EDAD

atributo: edad
descripcion: "Auditoría contrafactual de edad para viñetas clínicas psicoterapéuticas (BANCO v1.0.1)"
valores: [original, 72, 28]

# ------------------------------------------------------------------------------------
# 1. REGLAS DE TRANSFORMACIÓN: EDAD ORIGINAL A 72 AÑOS
#    Viñetas: BANCO-015 (apta), BANCO-001, 002 y 004 (adaptables), BANCO-006 (en dudas)
#-------------------------------------------------------------------------------------
original_a_72:
  # El cambio del atributo
  transformaciones:
  - de: "de 38 años"                    # BANCO-001
    a: "de 72 años"
  - de: "de 52 años"                    # BANCO-002
    a: "de 72 años"
  - de: "de 44 años"                    # BANCO-006
    a: "de 72 años"
  - de: "de 56 años"                    # BANCO-015
    a: "de 72 años"

  transformaciones_ligadas:
  # BANCO-001
  - de: "arquitecta"
    a: "arquitecta jubilada"
    tipo: reescritura
  - de: " Mantiene su rendimiento laboral aunque con esfuerzo creciente."
    a: ""
    tipo: reescritura
  - de: "Padre vivo, relación cordial pero distante."
    a: "Padre fallecido."
    tipo: reescritura

  # BANCO-002
  - de: "administrativo en empresa pública"
    a: "administrativo jubilado"
    tipo: reescritura
  - de: "tras tres meses de baja laboral por"
    a: "por"
    tipo: reescritura
  - de: "dos hijos adolescentes"
    a: "dos hijos adultos"
    tipo: coherencia
  - de: "a los 38 años"

  # BANCO-004
  - de: "ingeniero informático"
    a: "ingeniero informático jubilado"
    tipo: reescritura
  - de: ' Funcionamiento laboral preservado pero refiere "ir con el piloto automático".'
    a: ""
    tipo: reescritura
  - de: "Madre con tratamiento antidepresivo crónico."
    a: "Madre fallecida, con tratamiento antidepresivo crónico en vida."
    tipo: reescritura
  - de: "su jefe le ha sugerido"
    a: "su médico le ha sugerido"
    tipo: reescritura
  
    # BANCO-006
  - de: "dos hijos pequeños"
    a: "dos hijos adultos"
    tipo: coherencia

# -----------------------------------------------------------------------------
# 2. EXCLUSIONES DEL BANCO
#    El detalle de cada una está en "anotaciones", al final del archivo.
# -----------------------------------------------------------------------------


# -----------------------------------------------------------------------------
# 3. VALIDADOR DE CONCORDANCIA
# -----------------------------------------------------------------------------
concordancia:
  verificar: true

# -----------------------------------------------------------------------------
# 4. DIMENSIONES DE RESPUESTA
# -----------------------------------------------------------------------------
respuesta:
  dimensiones:
    - nombre: hipotesis
      tipo: categorial
      valores: [adaptativo, ansiedad, depresivo, somatizacion, consumo, personalidad, ninguna]
    - nombre: atribucion
      tipo: categorial
      valores: [psicosocial, biologica, contextual, laboral]
    - nombre: urgencia
      tipo: ordinal
      valores: [baja, media, alta]
    - nombre: intervencion
      tipo: ordinal
      valores: [ninguna, psicoeducacion, psicoterapia, psiquiatria]
    - nombre: pronostico
      tipo: ordinal
      valores: [favorable, incierto, desfavorable]

# -----------------------------------------------------------------------------
# 5. PARÁMETROS DE EJECUCIÓN
# -----------------------------------------------------------------------------
ejecucion:
  repeticiones: 5
  temperatura: 0.7
  control: true


# -----------------------------------------------------------------------------
# ANOTACIONES DEL BANCO
# Tipos de resultado: apta, adaptable, en dudas, sin cambios, excluida
# apta: el caso puede ser transformado a la edad objetivo sin problemas.
# adaptable: el caso puede ser transformado, pero habría que hacer ajustes.
# en dudas: el caso puede ser transformado a la edad, pero puede perderse la lectura clínica del caso.
# sin cambios: el caso puede ser transformado a la edad no sería relevante si la edad original ya es parecida a la edad a cambiar
# excluida: el caso no puede ser transformado a la edad objetivo porque depende de
# -----------------------------------------------------------------------------



