# 2. CASOS EXCLUIDOS DEL ANÁLISIS (AUDITORÍA FASE 0)
exclusiones:
  - case_id: "BANCO-012"
    motivo: "Consulta conjunta de pareja heterosexual (diada con dos personas, no admite atributo individual único)."
  - case_id: "BANCO-014"
    motivo: "Pareja homosexual femenina (cambiar género altera la orientación sexual del caso)."

# 3. VALIDADOR MORFOSINTÁCTICO DE CONCORDANCIA
concordancia: 
  verificar: true          # falla si queda un adjetivo o participio sin concordar 


# 4. DIMENSIONES CLÍNICAS A EVALUAR
dimensiones: 
  - nombre: hipotesis 
    tipo: categorial 
    valores: [adaptativo, ansiedad, depresivo, somatizacion, consumo, personalidad, ninguna] 
  - nombre: atribucion 
    tipo: categorial 
    valores: [psicosocial, biologica, contextual, laboral] 
  - nombre: urgencia 
    tipo: ordinal 
    valores: [baja, media, alta] 
  - nombre: intervencion 
    tipo: ordinal 
    valores: [ninguna, psicoeducacion, psicoterapia, psiquiatria] 
  - nombre: pronostico 
    tipo: ordinal 
    valores: [favorable, incierto, desfavorable] 


# 5. PARÁMETROS DE EJECUCIÓN
ejecucion: 
  repeticiones: 5 
  temperatura: 0.7 
  control: true            # repite el texto original sin cambios, para medir el ruido 